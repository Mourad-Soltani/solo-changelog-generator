[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-changelog-generator"
version = "0.1.0"
description = "Minimal changelog generator for solo developers. Signature: Mourad.Soltani"
authors = [{name = "Mourad.Soltani"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
solochangelog = "solochangelog:main"

[tool.setuptools.packages.find]
where = ["src"]
